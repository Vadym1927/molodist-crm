<div class="g2"><label>Імʼя<input name="name" value="{{ a.name or '' if a }}" placeholder="Як звертатися"></label><label>Телефон<input name="phone" value="{{ a.phone or '' if a }}" inputmode="tel" placeholder="+380…"></label></div>
<div class="g2"><label>Джерело<select name="source"><option value="">—</option>{% for x in d.sources %}<option {{ 'selected' if a and a.source==x }}>{{ x }}</option>{% endfor %}</select></label>
  <label>Причина звернення<select name="cause"><option value="">—</option>{% for x in d.causes %}<option {{ 'selected' if a and a.cause==x }}>{{ x }}</option>{% endfor %}</select></label></div>
<label>Що цікавить<input name="interest" value="{{ a.interest or '' if a }}" placeholder="ботулінотерапія, ціна на пілінг…"></label>
<div class="g2"><label>Статус<select name="status" onchange="this.form.querySelector('.deny').style.display=(this.selectedOptions[0].dataset.t=='fail')?'grid':'none'">{% for s in d.statuses %}<option data-t="{{ s.type }}" {{ 'selected' if (a.status if a else d.statuses[0].name)==s.name }}>{{ s.name }}</option>{% endfor %}</select></label>
  <label class="deny" style="display:{{ 'grid' if a and ap.status_type(d, a.status)=='fail' else 'none' }}">Причина відмови<select name="deny_reason"><option value="">—</option>{% for x in d.deny_reasons %}<option {{ 'selected' if a and a.deny_reason==x }}>{{ x }}</option>{% endfor %}</select></label></div>
<div class="g2"><label>Звʼязатися (дата й час)<input type="datetime-local" name="next_contact" value="{{ a.next_contact.strftime('%Y-%m-%dT%H:%M') if a and a.next_contact else '' }}"></label>
  <label>Відповідальний<select name="responsible_id"><option value="">Черга адмінів</option>{% for k, v in (users or {}).items() %}<option value="{{ k }}" {{ 'selected' if a and a.responsible_id==k }}>{{ v }}</option>{% endfor %}</select></label></div>
<div class="g2"><label>Потенційна сума, ₴<input name="amount" inputmode="decimal" value="{{ '%.2f'|format(a.amount) if a and a.amount else '' }}"></label><label>UTM / рекламна кампанія<input name="utm" value="{{ a.utm or '' if a }}"></label></div>
<label>Мітки</label><div class="chips">{% for m in d.marks %}<label><input type="checkbox" name="marks" value="{{ m }}" {{ 'checked' if a and m in (a.marks or []) }} style="width:auto">{{ m }}</label>{% endfor %}</div>
<label>Коментар<textarea name="comment" rows="3">{{ a.comment or '' if a }}</textarea></label>
