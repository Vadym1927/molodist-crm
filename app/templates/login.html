{% extends "base.html" %}
{% block title %}Вхід · MOLODIST{% endblock %}
{% block body %}
<style>
body{background:var(--deep)}
main{max-width:none;padding:0}
.lg{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.lg .l{display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;padding:40px;text-align:center}
.lg .w{font:400 clamp(44px,6vw,78px)/1 var(--word);letter-spacing:.16em;margin-left:.16em}
.lg .t{font:400 13px var(--sans);letter-spacing:.04em;color:rgba(255,255,255,.75);margin-top:10px}
.lg .ln{width:44px;height:1px;background:rgba(255,255,255,.6);margin:28px auto}
.lg .s{font:500 12px var(--head);letter-spacing:.22em;text-transform:uppercase;color:var(--lavender-2)}
.lg .r{background:var(--cream);display:flex;align-items:center;justify-content:center;padding:40px}
.lg form{width:100%;max-width:380px;display:grid;gap:12px}
.lg h1{font-size:26px;margin-bottom:10px}
.lg input{height:50px}.lg .btn{height:50px;justify-content:center;font-size:15px}
@media (max-width:820px){.lg{grid-template-columns:1fr}.lg .l{padding:60px 20px 40px}}
</style>
<div class="lg">
  <div class="l"><div class="w">MOLODIST</div><div class="t">медичний простір естетики та профілактики</div>
    <div class="ln"></div><div class="s">Beauty Plan · CRM</div></div>
  <div class="r"><form method="post">
    <div class="eyebrow">Вхід для команди</div><h1>Вітаємо!</h1>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <input name="login" placeholder="Логін" value="{{ login or '' }}" autocomplete="username" autofocus required>
    <input type="password" name="password" placeholder="Пароль" autocomplete="current-password" required>
    <button class="btn">Увійти</button></form></div>
</div>
{% endblock %}
