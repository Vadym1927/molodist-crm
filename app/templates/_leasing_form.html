<form method="post" action="/finance/leasing/save" class="frm">
  <input type="hidden" name="id" value="{{ c.id or '' }}">
  <label class="w2">Назва<input name="name" value="{{ c.name or '' }}" required placeholder="Напр. Лазер Splendor X"></label>
  <label>Група<select name="group">{% for k, t in v.GROUPS.items() %}<option value="{{ k }}" {{ 'selected' if c.group == k }}>{{ t }}</option>{% endfor %}</select></label>
  <label>або нова група<input name="group_new" placeholder="Назва нової групи"></label>
  <label>Тип<select name="kind">{% for k, t in v.KINDS.items() %}<option value="{{ k }}" {{ 'selected' if (c.kind or 'instalment') == k }}>{{ t }}</option>{% endfor %}</select></label>
  <label>Банк / кредитор<input name="bank" value="{{ c.bank or '' }}" placeholder="monobank, ПриватБанк, лізингова компанія…"></label>
  <label class="w2">Умови<input name="terms" value="{{ c.terms or '' }}" placeholder="10 платежів без переплати · комісія 1,9% / міс · аванс 20%"></label>
  <label>Повна сума, ₴<input name="total" value="{{ c.total or '' }}" inputmode="decimal" required></label>
  <label>Сплачено до CRM, ₴<input name="paid_before" value="{{ c.paid_before or 0 }}" inputmode="decimal"></label>
  <label>Платіж / міс, ₴<input name="monthly" value="{{ c.monthly or '' }}" inputmode="decimal"></label>
  <label>Ставка / комісія, %<input name="rate" value="{{ c.rate or '' }}" inputmode="decimal" placeholder="необовʼязково"></label>
  <label>Наступний платіж<input type="date" name="next" value="{{ c.next or '' }}"><span class="mini">число місяця = день платежу</span></label>
  <label class="w3" style="grid-column:span 3">Примітка<input name="note" value="{{ c.note or '' }}"></label>
  <div style="grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn">Зберегти й оновити графік</button><a href="/finance/leasing" class="btn ghost">Скасувати</a>
    <span class="mini">Кредит, розтермінування, лізинг — графік у платіжному календарі: решта = сума − сплачено, по «платіж / міс» від дати наступного платежу. «Погашення з фонду» — без графіка, гроші накопичуються в банці.</span></div>
</form>
