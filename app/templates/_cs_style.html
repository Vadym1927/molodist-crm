<style>
.cs-tag{display:inline-block;background:#8e98a6;color:#fff;font:700 12px var(--head);letter-spacing:.06em;text-transform:uppercase;padding:7px 14px;border-radius:8px 8px 0 0;margin-left:14px}
.cs-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:22px;box-shadow:var(--shadow)}
.cs-note{border-left:4px solid #5B9BD5;background:#F4F8FD;border-radius:10px;padding:12px 16px;color:#4a4f57;font-size:14px}
.cs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:16px}
.cs-card{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;cursor:pointer;text-align:left;font:inherit;color:inherit;box-shadow:var(--shadow)}
.cs-card:hover{border-color:var(--classic)}.cs-card b{display:block;font:600 17px var(--head);text-transform:uppercase;color:var(--classic);margin-bottom:6px}
.cs-card span{font-size:13.5px;color:var(--muted)}.cs-card i{font-style:normal;font-size:26px;color:var(--classic)}
.loc{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#FAF9F7;margin-top:14px}
.loc .lb{display:block;width:100%;margin-top:8px;border:1.5px solid #5B9BD5;color:#2f65a0;background:#fff;border-radius:10px;padding:8px;font:700 13px var(--sans);letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.loc .lb:hover{background:#F4F8FD}
.on-pill{display:inline-block;padding:2px 9px;border-radius:7px;font:800 12px var(--sans)}.on-pill.on{background:#4CAF50;color:#fff}.on-pill.off{background:#ddd;color:#666}
dialog.cs-d{border:0;border-radius:18px;padding:0;width:min(620px,96vw);max-height:90vh;box-shadow:0 30px 80px rgba(42,36,48,.35)}
dialog.cs-d::backdrop{background:rgba(42,36,48,.45)}
.cs-dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.cs-dh h3{margin:0;font:600 18px var(--head);text-transform:uppercase}.cs-x{border:0;background:var(--soft);width:36px;height:36px;border-radius:10px;font-size:20px;cursor:pointer}
.cs-db{padding:16px 18px 20px;display:grid;gap:12px}
.cs-f{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}.cs-f label{font:700 11.5px var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.cs-f select,.cs-f input{height:44px}.cs-f .hint{font-size:12.5px;color:var(--muted)}
.it-row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#FAF9F7}
.it-row .nm{flex:1;min-width:0}.it-row .nm input{width:100%;height:36px;border-color:transparent;background:transparent;color:#2f65a0;font-weight:600}
.it-row .nm input:focus{background:#fff;border-color:var(--line)}.it-row button{border:0;background:none;cursor:pointer;padding:4px 6px;border-radius:7px}
.it-row .del{border:1.5px solid #E8A0A0;color:#C0392B;font:700 11px var(--sans);padding:3px 8px}
.hr-row{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.hr-row input[type=time]{height:40px}
.sw{position:relative;display:inline-flex;align-items:center;gap:8px;font-weight:700}
.sw input{appearance:none;width:44px;height:24px;border-radius:12px;background:#ccc;position:relative;cursor:pointer;transition:background .15s;border:0;padding:0}
.sw input:checked{background:#4CAF50}.sw input:before{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw input:checked:before{left:23px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips label{display:inline-flex;gap:6px;align-items:center;background:var(--soft);border-radius:8px;padding:6px 10px;font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:600}

.ch-btn{border:1.5px solid #5B9BD5;color:#2f65a0;background:#fff;border-radius:9px;padding:6px 12px;font:700 12px var(--sans);text-transform:uppercase;cursor:pointer}
.cp{display:flex;gap:6px}.cp input{flex:1;min-width:0}
.pv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.pv label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);border-radius:14px;padding:18px 10px;cursor:pointer;background:#fff;font:700 14px var(--head);text-transform:uppercase}
.pv input{display:none}.pv label:has(input:checked){border-color:#4CAF50;background:#F1FAF1}
.pv .lg{font:800 18px var(--sans);text-transform:none}
.ok-t{color:var(--ok);font-weight:700}.bad-t{color:#C0392B;font-weight:700}
</style>
