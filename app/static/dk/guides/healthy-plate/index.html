<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Як скласти свою тарілку — Дарʼя Колган</title>
  <meta name="description" content="Простий гайд зі збалансованого харчування від Дарʼї Колган.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root{--ink:#1e1b22;--paper:#f7f3ee;--line:#e5dee9;--muted:#5e5468;--white:#fff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Manrope,Arial,sans-serif}.nav{display:flex;justify-content:space-between;gap:20px;align-items:center;max-width:none;margin:0;padding:16px max(24px,calc((100vw - 1120px)/2));background:rgba(255,255,255,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.brand{display:inline-flex;align-items:center;color:inherit;text-decoration:none}.brand img{display:block;width:122px;height:auto}.nav-actions{display:flex;align-items:center;gap:10px}.back,.cabinet{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 18px;border-radius:999px;font:600 13px Manrope,Arial,sans-serif;text-decoration:none;transition:background .18s ease,transform .18s ease}.back{background:var(--ink);color:#fff}.cabinet{border:1px solid var(--ink);color:var(--ink)}.back:hover,.back:focus-visible{background:#3a3342;color:#fff;transform:translateY(-1px)}.cabinet:hover,.cabinet:focus-visible{background:#fff;color:var(--ink);transform:translateY(-1px)}.back:focus-visible,.cabinet:focus-visible{outline:3px solid rgba(30,27,34,.2);outline-offset:3px}.wrap{max-width:1120px;margin:auto;padding:68px 32px 82px}.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}h1{max-width:800px;margin:12px 0 14px;font:300 clamp(42px,5.5vw,68px)/.98 Jost,sans-serif;letter-spacing:-.06em}.lead{max-width:650px;margin:0;color:#4a4252;font-size:17px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:30px 0}.btn{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:0 24px;border:1px solid var(--ink);border-radius:999px;color:var(--ink);font:600 15px Manrope,Arial,sans-serif;text-decoration:none;background:transparent;cursor:pointer;transition:background .18s ease,color .18s ease}.btn:hover,.btn:focus-visible{background:#fff;color:var(--ink)}.btn-primary{background:var(--ink);border-color:var(--ink);color:#fff}.btn-primary:hover,.btn-primary:focus-visible{background:#3a3342;color:#fff}.pdf{height:min(76vh,920px);min-height:520px;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 10px 30px rgba(30,27,34,.06)}.pdf iframe{width:100%;height:100%;border:0}.notice{margin:16px 0 0;color:var(--muted);font-size:13px}.notice a{color:var(--ink);font-weight:600}@media(max-width:720px){.nav{padding:14px 20px}.brand img{width:108px}.nav-actions{gap:7px}.back,.cabinet{min-height:40px;padding:0 12px;font-size:11px}.wrap{padding:44px 20px 60px}h1{font-size:44px}.lead{font-size:16px}.actions{display:grid;grid-template-columns:1fr;margin:24px 0}.pdf{height:72vh;min-height:430px;border-radius:16px}.btn{width:100%}}
  </style>
</head>
<body>
  <nav class="nav"><div class="nav-actions" style="margin-left:auto"><a class="cabinet" href="/dr-kolgan/cabinet/">Кабінет</a><a class="back" id="return-link" href="/dr-kolgan/#products">← Назад</a></div></nav>
  <main class="wrap">
    <div class="eyebrow">Безкоштовний гайд</div>
    <h1>Як скласти свою тарілку</h1>
    <p class="lead">Простий гайд зі збалансованого харчування.</p>
    <div class="actions">
      <a class="btn btn-primary" href="./tarilka-zdorovoho-kharchuvannia.pdf" download>Зберегти PDF</a>
      <button class="btn" type="button" id="print-guide">Друкувати</button>
    </div>
    <div class="pdf"><iframe title="Гайд «Як скласти свою тарілку»" src="./tarilka-zdorovoho-kharchuvannia.pdf#view=FitH"></iframe></div>
    <p class="notice" id="material-status">Додаємо гайд до вашого кабінету…</p>
  </main>
  <script>
    document.getElementById('return-link').addEventListener('click', (event) => {
      const sameSiteReferrer = document.referrer && new URL(document.referrer).origin === window.location.origin;
      if (sameSiteReferrer && window.history.length > 1) { event.preventDefault(); window.history.back(); }
    });
    const status = document.getElementById('material-status');
    fetch('/dr-kolgan/api/auth/materials', {method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:'healthy-plate'})})
      .then(response => response.ok ? response.json() : Promise.reject())
      .then(() => { status.textContent = 'Гайд додано до розділу «Матеріали» у вашому кабінеті.'; })
      .catch(() => { status.innerHTML = 'Щоб зберегти гайд у кабінеті, <a href="/dr-kolgan/?login=1&returnTo=%2Fdr-kolgan%2Fguides%2Fhealthy-plate%2F">увійдіть за номером телефону</a>.'; });
    document.getElementById('print-guide').addEventListener('click', () => {
      const pdf = window.open('./tarilka-zdorovoho-kharchuvannia.pdf', '_blank');
      if (pdf) pdf.addEventListener('load', () => pdf.print(), {once:true});
    });
  </script>
</body>
</html>
