<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Повний ЧЕК-АП MOLODIST — Дарʼя Колган</title><link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#1e1b22;--paper:#f7f3ee;--line:#e5dee9;--muted:#5e5468}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Manrope,Arial,sans-serif}.nav{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:16px max(24px,calc((100vw - 1120px)/2));background:rgba(255,255,255,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.brand{display:inline-flex;align-items:center;color:inherit;text-decoration:none}.brand img{display:block;width:122px;height:auto}.nav-actions{display:flex;align-items:center;gap:10px}.back,.cabinet{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 18px;border-radius:999px;font:600 13px Manrope,Arial,sans-serif;text-decoration:none;transition:background .18s ease,transform .18s ease}.back{background:var(--ink);color:#fff}.cabinet{border:1px solid var(--ink);color:var(--ink)}.back:hover,.back:focus-visible{background:#3a3342;color:#fff;transform:translateY(-1px)}.cabinet:hover,.cabinet:focus-visible{background:#fff;color:var(--ink);transform:translateY(-1px)}.back:focus-visible,.cabinet:focus-visible{outline:3px solid rgba(30,27,34,.2);outline-offset:3px}.wrap{max-width:1120px;margin:auto;padding:68px 32px 82px}.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}h1{max-width:800px;margin:12px 0 14px;font:300 clamp(42px,5.5vw,68px)/.98 Jost,sans-serif;letter-spacing:-.06em}.lead{max-width:650px;margin:0;color:#4a4252;font-size:17px}.viewer{margin-top:30px;border:1px solid var(--line);border-radius:20px;background:#fff;overflow:hidden;box-shadow:0 10px 30px rgba(30,27,34,.06)}.viewer-head{position:sticky;top:0;z-index:2;padding:14px 18px;background:var(--ink);color:#fff;display:flex;justify-content:space-between;gap:12px;font-size:13px}.pages{padding:22px;display:grid;gap:20px}.page{position:relative;margin:auto;max-width:900px;box-shadow:0 4px 20px #1e1b2225;background:#eee;user-select:none}.page img{display:block;width:100%;height:auto;pointer-events:none}.guide-link{position:absolute;display:block;border-radius:2px;background:transparent;cursor:pointer}.guide-link:hover{background:rgba(119,91,170,.14);outline:1px solid rgba(119,91,170,.55)}.guide-link:focus-visible{background:rgba(119,91,170,.18);outline:3px solid #775baa;outline-offset:1px}.blocked{padding:34px;border:1px solid var(--line);border-radius:20px;background:#fff;margin-top:30px;box-shadow:0 10px 30px rgba(30,27,34,.04)}.btn{display:inline-flex;margin-top:14px;min-height:48px;padding:0 24px;align-items:center;justify-content:center;border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;font:600 15px Manrope,Arial,sans-serif;cursor:pointer}.btn:hover,.btn:focus-visible{background:#3a3342;color:#fff}@media(max-width:720px){.nav{padding:14px 20px}.brand img{width:108px}.nav-actions{gap:7px}.back,.cabinet{min-height:40px;padding:0 12px;font-size:11px}.wrap{padding:44px 20px 60px}h1{font-size:44px}.lead{font-size:16px}.pages{padding:10px;gap:12px}.viewer,.blocked{border-radius:16px}}
</style></head><body><nav class="nav"><div class="nav-actions" style="margin-left:auto"><a class="cabinet" href="/dr-kolgan/cabinet/">Кабінет</a><a class="back" id="return-link" href="/dr-kolgan/#products">← Назад</a></div></nav><main class="wrap"><div class="eyebrow">Придбаний гайд · лише для особистого використання</div><h1>Повний ЧЕК-АП MOLODIST</h1><p class="lead">Розширений гайд з аналізів і їх інтерпретації.</p><div id="app" class="blocked">Перевіряємо доступ…</div></main><script>
const app=document.querySelector('#app');const login='/dr-kolgan/?login=1&returnTo=%2Fdr-kolgan%2Fguides%2Ffull-checkup%2F';
Promise.all([fetch('/dr-kolgan/api/auth/protected/full-checkup/access',{credentials:'same-origin'}).then(async r=>({ok:r.ok,status:r.status,data:await r.json().catch(()=>({}))})),fetch('./links.json',{cache:'no-store'}).then(r=>r.ok?r.json():{})]).then(([access,linkMap])=>{const{ok,status,data}=access;if(!ok&&status===401){app.innerHTML=`<p>Увійдіть за номером телефону, щоб відкрити придбаний гайд.</p><a class="btn" href="${login}">Увійти</a>`;return}if(!ok||!data.granted){app.innerHTML='<p>Доступ до цього гайду з’явиться в кабінеті після успішної оплати.</p><a class="btn" href="/dr-kolgan/#products">До матеріалів</a>';return}const viewer=document.createElement('section');viewer.className='viewer';viewer.innerHTML='<div class="viewer-head"><span>Захищений перегляд</span><span>Посилання в гайді активні · завантаження та друк недоступні</span></div><div class="pages"></div>';const pages=viewer.querySelector('.pages');for(let i=1;i<=47;i++){const page=document.createElement('div');page.className='page';page.id=`page-${i}`;const img=document.createElement('img');img.alt=`Сторінка ${i}`;img.src=`/dr-kolgan/api/auth/protected/full-checkup/page/${i}.jpg`;img.loading=i<3?'eager':'lazy';page.append(img);const map=linkMap[i];if(map){for(const link of map.links){const href=link.href;if(!(/^#page-\d+$/.test(href)||/^(https?:|tel:)/.test(href)))continue;const a=document.createElement('a');a.className='guide-link';a.href=href;a.setAttribute('aria-label',href.startsWith('#')?'Перейти до сторінки гайду':`Відкрити посилання: ${href}`);a.style.cssText=`left:${link.left/map.width*100}%;top:${link.top/map.height*100}%;width:${link.width/map.width*100}%;height:${link.height/map.height*100}%`;if(/^https?:/.test(href)){a.target='_blank';a.rel='noopener noreferrer'}page.append(a)}}pages.append(page)}app.replaceWith(viewer)}).catch(()=>{app.textContent='Не вдалося перевірити доступ. Оновіть сторінку.'});
document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['p','s'].includes(e.key.toLowerCase()))e.preventDefault()});document.getElementById('return-link').addEventListener('click',event=>{const ref=document.referrer;if(ref){try{if(new URL(ref).origin===location.origin&&history.length>1){event.preventDefault();history.back()}}catch(_){}}});
</script></body></html>
