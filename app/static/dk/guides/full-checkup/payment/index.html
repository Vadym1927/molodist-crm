<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Перевіряємо оплату — MOLODIST</title><meta name="robots" content="noindex"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f7f4;color:#1e1b22;font:16px Arial}.box{max-width:420px;padding:32px;text-align:center;background:#fff;border:1px solid #d9d2dc;border-radius:16px}a{display:inline-flex;margin-top:14px;padding:13px 20px;border-radius:999px;background:#775baa;color:#fff;text-decoration:none}</style></head><body><main class="box"><h1>Перевіряємо оплату</h1><p id="status">Зачекайте кілька секунд…</p><a id="open" hidden href="/dr-kolgan/guides/full-checkup/">Відкрити гайд</a></main>
<script>
const id=new URLSearchParams(location.search).get('orderReference');
const s=document.querySelector('#status'),a=document.querySelector('#open');let attempt=0;
const check=()=>{
if(!id||attempt++>24){s.textContent='Оплату ще не підтверджено. Якщо кошти списалися, оновіть сторінку за хвилину.';return}
fetch('/dr-kolgan/api/auth/payments/monobank/status?orderReference='+encodeURIComponent(id),{credentials:'same-origin'}).then(r=>r.json()).then(d=>{
if(d.granted){s.textContent='Оплату підтверджено. Відкриваємо гайд…';a.hidden=false;setTimeout(()=>window.location.assign('/dr-kolgan/guides/full-checkup/'),700);return}
if(d.status==='Declined'||d.status==='Expired'){s.textContent='Оплату не підтверджено. Спробуйте ще раз.';return}setTimeout(check,2500)}).catch(()=>setTimeout(check,2500))};check();
</script></body></html>
